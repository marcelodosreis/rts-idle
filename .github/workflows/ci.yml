name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # Build before typecheck: emitting packages resolve workspace deps via
      # their built `dist` types, which do not exist on a fresh checkout.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test:architecture
      - run: pnpm run test:unit
      - run: pnpm run test:integration
      - run: pnpm run test:simulation
      - run: pnpm run test:determinism
      - run: pnpm run test:invariants
      - run: pnpm run test:regression
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

  release:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}