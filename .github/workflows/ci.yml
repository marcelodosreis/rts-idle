name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static_gate:
    name: Lint, Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: |
            packages/*/dist
            apps/server/dist
            tools/*/dist
          if-no-files-found: warn

  code_tests:
    name: Code Tests
    needs: static_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - name: Unit tests
        run: pnpm run test:unit
      - name: Integration tests
        if: ${{ success() || github.event_name == 'push' }}
        run: pnpm run test:integration
      - name: Simulation tests
        if: ${{ success() || github.event_name == 'push' }}
        run: pnpm run test:simulation
      - name: Contract tests
        if: ${{ success() || github.event_name == 'push' }}
        run: pnpm run test:contracts
      - name: Orders tests
        if: ${{ success() || github.event_name == 'push' }}
        run: pnpm run test:orders
      - name: Determinism tests
        if: ${{ success() || github.event_name == 'push' }}
        run: pnpm run test:determinism
      - name: Architecture tests
        if: ${{ success() || github.event_name == 'push' }}
        run: pnpm run test:architecture
      - name: Invariants tests
        if: ${{ success() || github.event_name == 'push' }}
        run: pnpm run test:invariants

  e2e_functional:
    name: Functional End-to-End Tests
    needs: [static_gate, code_tests]
    if: ${{ always() && needs.static_gate.result == 'success' && (needs.code_tests.result == 'success' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_WORKERS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm run test:e2e:fast

  e2e_performance:
    name: Performance End-to-End Tests
    needs: [static_gate, code_tests, e2e_functional]
    if: ${{ always() && needs.static_gate.result == 'success' && (github.event_name == 'push' || (needs.code_tests.result == 'success' && needs.e2e_functional.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_WORKERS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm run test:e2e:perf

  release:
    name: Release
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: [static_gate, code_tests, e2e_functional, e2e_performance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
