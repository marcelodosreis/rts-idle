name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: |
            packages/*/dist
            apps/server/dist
            tools/*/dist
          if-no-files-found: warn

  unit_integration:
    name: Unit & Integration Tests
    needs: lint_typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run test:unit
      - run: pnpm run test:integration

  simulation:
    name: Simulation, Contracts, Orders & Invariants Tests
    needs: unit_integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run test:simulation
      - run: pnpm run test:contracts
      - run: pnpm run test:orders
      - run: pnpm run test:invariants

  determinism_architecture:
    name: Determinism & Architecture Tests
    needs: simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run test:determinism
      - run: pnpm run test:architecture

  e2e:
    name: End-to-End Tests
    needs: determinism_architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: .
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm run test:e2e:all

  release:
    name: Release
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
