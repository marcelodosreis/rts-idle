name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint + typecheck first. typecheck resolves workspace deps through their
  # built `dist` types, so this job builds before typechecking on a fresh
  # checkout, then shares the dist artifact with e2e.
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/*/dist
            apps/server/dist
            tools/*/dist
          if-no-files-found: warn

  test-unit-integration:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run test:unit
      - run: pnpm run test:integration

  test-simulation:
    needs: test-unit-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run test:simulation
      - run: pnpm run test:invariants
      - run: pnpm run test:regression

  test-determinism:
    needs: test-simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run test:determinism

  test-architecture:
    needs: test-determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run test:architecture

  test-e2e:
    needs: test-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

  release:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: test-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}