name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static_gate:
    name: Lint, Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: |
            packages/*/dist
            apps/server/dist
            tools/*/dist
          if-no-files-found: warn

  code_tests:
    name: Code Tests (${{ matrix.suite }})
    needs: static_gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - integration
          - simulation
          - contracts
          - orders
          - determinism
          - architecture
          - invariants
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - name: Run suite
        run: pnpm run test:${{ matrix.suite }}

  e2e_functional:
    name: Functional E2E (${{ matrix.browser }})
    needs: [static_gate, code_tests]
    if: ${{ needs.static_gate.result == 'success' && needs.code_tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      E2E_WORKERS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run functional tests
        run: pnpm run test:e2e -- --project=${{ matrix.browser }} --grep-invert @perf
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-functional-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e_performance:
    name: Performance E2E (${{ matrix.browser }})
    needs: [static_gate, code_tests]
    if: ${{ needs.static_gate.result == 'success' && needs.code_tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      E2E_WORKERS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run performance tests
        run: pnpm run test:e2e -- --project=${{ matrix.browser }} --workers=1 --grep @perf
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-performance-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: [static_gate, code_tests, e2e_functional, e2e_performance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
