name: ci-setup
description: pnpm, Node, and install for CI jobs (run actions/checkout first)
inputs:
  install:
    description: Install command
    required: false
    default: pnpm install --frozen-lockfile
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.33.2
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
    - run: ${{ inputs.install }}
      shell: bash